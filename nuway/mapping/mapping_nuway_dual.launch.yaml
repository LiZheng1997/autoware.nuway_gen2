---
# Dual-lidar + gravity-alignment mapping launch. Based on spark_fast_lio's
# mapping_nuway_campus.launch.yaml, with three changes:
#   1. lidar_topic/lidar_frame/config_path defaults point to the merged cloud produced by
#      merge_velodyne_clouds.py (already in base_link, keeps per-point time normalized to the
#      start of the merged frame)
#   2. Removed the rviz node (headless run)
#
# gravity_alignment stays false -- we tried enabling it, but it never completes (observed stuck
# on "Gravity alignment is enabled but not yet completed", with the collector seeing 0 frames).
# The reason is in isMotionStopped(): `‖acc_ref − acc_curr‖ <= acc_diff_thr(0.2)` is how it
# decides the vehicle is stationary, but nUWAy creeps along at a constant 1.25 m/s, so the
# acceleration variation never exceeds that threshold and the counter keeps resetting to zero.
# That feature is meant for robots that get picked up or jerked around. Gravity alignment for
# the map is instead done after the fact with a single SE(3) leveling pass on the ground plane;
# whether that's valid is decided by check_map.py's "constant tilt vs. cumulative drift"
# diagnosis.
launch:
  - arg: {name: use_sim_time, default: 'true'}
  - arg: {name: map_frame, default: 'fast_lio_odom'}
  - arg: {name: base_frame, default: 'base_link'}
  - arg: {name: imu_frame, default: 'imu_link'}
  - arg: {name: lidar_frame, default: 'base_link'}
  - arg: {name: lidar_topic, default: '/lidar/velodyne/merged/cloud'}
  - arg: {name: config_path, default: $(find-pkg-share spark_fast_lio)/config/nuway_campus_merged.yaml}

  - node:
      pkg: spark_fast_lio
      exec: spark_lio_mapping
      name: fast_lio2_nuway
      output: screen
      on_exit: shutdown

      remap:
        - {from: 'lidar', to: "$(var lidar_topic)"}
        - {from: 'imu', to: '/imu/data'}
        - {from: 'odometry', to: '/Odometry'}
        - {from: 'path', to: '/fast_lio/path'}
        - {from: 'cloud_registered', to: '/fast_lio/cloud_registered'}
        - {from: 'cloud_registered_base', to: '/fast_lio/cloud_registered_base'}

      param:
        - name: use_sim_time
          value: "$(var use_sim_time)"
        - name: "common.map_frame"
          value: "$(var map_frame)"
        - name: "common.base_frame"
          value: "$(var base_frame)"
        - name: "common.imu_frame"
          value: "$(var imu_frame)"
        - name: "common.lidar_frame"
          value: "$(var lidar_frame)"
        - name: "common.visualization_frame"
          value: "base"
        - name: "common.time_sync_en"
          value: false
        - name: "gravity_alignment.enable_gravity_alignment"
          value: false
        - name: "extrinsics_timeout_s"
          value: 20.0
        - from: $(var config_path)
