# Install into /etc/sysctl.d/ and then run: sudo sysctl --system
# One Autoware launch brings up around 140 nodes, and a single pointcloud frame is
# several MB - all of it over UDP on the loopback interface.
# Ubuntu's default rmem_max is only 212992 (208 KB), which drops packets silently and
# unevenly. Typical symptoms: only one of three lidars carries data, or
# "gyro_odometer: IMU msg is timeout".
# setup-dev-env.sh does not install this, so it has to be done by hand.
net.core.rmem_max=2147483647
net.core.wmem_max=2147483647
net.ipv4.ipfrag_time=3
net.ipv4.ipfrag_high_thresh=134217728
