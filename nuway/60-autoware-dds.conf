# 安装到 /etc/sysctl.d/ 后执行 sudo sysctl --system
# Autoware 一次启动 ~140 个节点、点云单帧数 MB，全部走 UDP 回环。
# Ubuntu 默认 rmem_max 仅 212992（208 KB），会静默丢包且丢得不均匀
# （典型症状：三路雷达只有一路有数据 / gyro_odometer: IMU msg is timeout）。
# setup-dev-env.sh 不会落这个配置，必须手工装。
net.core.rmem_max=2147483647
net.core.wmem_max=2147483647
net.ipv4.ipfrag_time=3
net.ipv4.ipfrag_high_thresh=134217728
