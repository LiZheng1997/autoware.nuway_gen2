ntrip_client:
  ros__parameters:
    # NTRIP caster. Defaults target AUSCORS, the free national service run by
    # Geoscience Australia. Register once at https://gnss.ga.gov.au/registration
    #
    # Mountpoints nearest UWA Crawley, taken from the AUSCORS source table and
    # then measured by actually pulling 15 s from each:
    #
    #   CUT000AUS0  7.3 km  Perth (Curtin)     MSM7, 5 constellations, ephemerides
    #   SALT00AUS0  6.9 km  Salter Point (WA)  MSM4, 4 constellations, no ephemerides
    #   PERT00AUS0 21.0 km  Gnangara (WA)      not measured
    #
    # CUT000AUS0 is the default despite being 400 m further away. It carries
    # MSM7 rather than MSM4, it includes Galileo where Salter Point advertises
    # it but does not currently broadcast it, and it embeds GPS and GLONASS
    # ephemerides (1019/1020) so a cold-started receiver does not have to wait
    # on the satellites' own navigation message before it can fix. It costs
    # about 12 kbit/s against Salter Point's 3.9 kbit/s, which is negligible on
    # a cellular link. Both are single-base mounts needing no GGA feedback, and
    # a 7 km baseline sits comfortably inside the 20-30 km where single-base RTK
    # holds 2-3 cm.
    host: ntrip.data.gnss.ga.gov.au
    port: 2101
    mountpoint: CUT000AUS0

    # Credentials are NOT stored here. ntrip_launch.py reads NTRIP_USER and
    # NTRIP_PASS from the environment and overrides these placeholders. An
    # earlier revision of this file committed a real username and password,
    # which then had to be rotated - do not put them back.
    username: ""
    password: ""

    # NMEA and update rate. The client decimates the driver's NMEA stream down
    # to update_rate before forwarding GGA, because casters expect roughly one
    # position report per second rather than the driver's full rate.
    nmea_input_rate: 1.0
    update_rate: 1.0

    # Connection handling
    reconnect_delay: 5.0
    max_reconnect_attempts: 0     # 0 means retry forever

    # send_default_gga must be false on the vehicle so that the real GNSS
    # position is reported to the caster. SALT00AUS0 and CUT000AUS0 are
    # single-base mounts that do not require GGA feedback at all, but network
    # RTK mounts do.
    send_default_gga: false
    debug: false
    output_rtcm_details: false
